<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Demo</title>

  <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav>
    <div class="logo">
      <img src="./assets/logo.png" alt="Tienda Demo">
    </div>

    <div class="buscador">
      <input type="text" placeholder="Buscar..." id="buscadorInput">
      <button aria-label="Buscar"><i class="bi bi-search"></i></button>
    </div>

    <button class="carrito" aria-label="Carrito" id="btnCarrito"><i class="bi bi-basket"></i></button>
    <button class="menu-btn" aria-label="Menú"><i class="bi bi-list"></i></button>
  </nav>

  <!-- ===== CARRUSEL DE BANNERS ===== -->
  <section class="banner">
    <div class="carrusel" id="carruselBanners">
      <!-- Acá se cargan los banners dinámicamente -->
      <div class="banner-img" style="display:flex; align-items:center; justify-content:center; color:#aaa;">
        Cargando ofertas...
      </div>
    </div>
  </section>

  <!-- ===== CATEGORÍAS ===== -->
  <section class="categorias" id="categorias">
    <!-- Se llena dinámicamente desde Firestore -->
  </section>

  <!-- ===== PRODUCTOS ===== -->
  <section class="productos" id="productos">
    <!-- Se llena dinámicamente desde Firestore -->
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>© 2026 Tienda Demo</p>
  </footer>

  <!-- ===== MENÚ LATERAL ===== -->
  <aside class="menu-lateral">
    <button class="cerrar" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button>
    <ul>
      <li><a href="./index.html">Inicio</a></li>
      
      <!-- El desplegable de Categorías -->
      <li>
        <a href="#categorias" id="linkMenuCategorias" style="display: flex; justify-content: space-between; align-items: center;">
          Categorías <i class="bi bi-chevron-down" id="flechaCategorias" style="font-size: 0.8rem; transition: transform 0.3s ease;"></i>
        </a>
        <!-- Las subcategorías se cargan acá -->
        <ul id="subMenuCategorias" style="display: none; margin-left: 1rem; margin-top: 0.5rem; border-left: 1px solid var(--border); padding-left: 0.8rem;">
        </ul>
      </li>

      <li><a href="https://wa.me/5492616946182" target="_blank">Contacto</a></li>
    </ul>
  </aside>

  <!-- ===== OVERLAY ===== -->
  <div class="overlay"></div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== MODAL DETALLE PRODUCTO ===== -->
  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal-producto" id="modalProducto">
    <button class="modal-volver" id="modalVolver" aria-label="Volver"><i class="bi bi-arrow-left"></i></button>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <h2 id="modalNombre">Nombre</h2>
      <p class="modal-descripcion" id="modalDescripcion"></p>
      <p class="modal-precio" id="modalPrecio"></p>
      <p class="modal-stock" id="modalStock"></p>
      <div class="modal-cantidad">
        <button class="cant-btn" id="cantMenos">−</button>
        <span id="cantValor">1</span>
        <button class="cant-btn" id="cantMas">+</button>
      </div>
      <button class="btn-agregar-modal" id="btnAgregarModal">Agregar al carrito</button>
    </div>
  </div>

  <!-- ===== MODAL CONFIRMACIÓN ===== -->
  <div class="modal-confirm-overlay" id="confirmOverlay"></div>

  <div class="modal-confirm" id="confirmModal">
    <div class="confirm-icono"><i class="bi bi-check-lg"></i></div>
    <p class="confirm-texto">Producto añadido al carrito exitosamente</p>
    <div class="confirm-botones">
      <button class="btn-ver-carrito" id="btnVerCarrito">Ver carrito</button>
      <button class="btn-seguir" id="btnSeguirComprando">Seguir comprando</button>
    </div>
  </div>

  <!-- ===== MODAL CARRITO ===== -->
  <div class="modal-carrito-overlay" id="carritoOverlay"></div>

  <div class="modal-carrito" id="modalCarrito">
    <!-- VISTA 1: CARRITO -->
    <div id="vistaCarrito">
      <div class="carrito-header">
        <h2>Tu pedido</h2>
        <button class="carrito-cerrar" id="carritoCerrar" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="carrito-body" id="carritoBody"></div>
      <div class="carrito-footer" id="carritoFooter">
        <div class="carrito-total">
          <span>Total:</span>
          <strong id="carritoTotal">$0</strong>
        </div>
        <button class="btn-finalizar" id="btnFinalizar">Finalizar pedido</button>
      </div>
    </div>

    <!-- VISTA 2: PEDIDO FINALIZADO -->
    <div id="vistaFinalizado" style="display:none;">
      <div class="carrito-header">
        <h2>¡Pedido listo!</h2>
        <button class="carrito-cerrar" id="carritoCerrarFinal" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="carrito-body">
        <div class="pedido-finalizado">
          <p>Tu código de pedido es:</p>
          <div class="codigo-grande" id="codigoPedido">#XXXX</div>
          <p class="pedido-instruccion">Enviá este mensaje por WhatsApp para coordinar el pago y la entrega.</p>
        </div>
      </div>
      <div class="carrito-footer">
        <button class="btn-whatsapp" id="btnWhatsApp"><i class="bi bi-whatsapp"></i> Enviar por WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script type="module" src="./js/main.js"></script>

</body>
</html>
