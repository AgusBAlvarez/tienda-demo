<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Baul de Maribel</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav>
    <div class="logo">
      <img src="./assets/logo.png" alt="El Baul de Maribel">
    </div>

    <div class="buscador">
      <input type="text" placeholder="Buscar...">
      <button aria-label="Buscar">🔍</button>
    </div>

    <button class="carrito" aria-label="Carrito">🛒</button>
    <button class="menu-btn" aria-label="Menú">☰</button>
  </nav>

  <!-- ===== BANNER ===== -->
  <section class="banner">
    <div class="banner-img"></div>
  </section>

    <!-- ===== CATEGORÍAS ===== -->
    <section class="categorias">
        <button class="categoria active">Todos</button>
        <button class="categoria">Ofertas</button>
        <button class="categoria">Nuevos</button>
        <button class="categoria">Más vendidos</button>
        <button class="categoria">Decoración</button>
        <button class="categoria">Cocina</button>
        <button class="categoria">Regalos</button>
        <button class="categoria">Hogar</button>
    </section>

  <!-- ===== PRODUCTOS ===== -->
  <section class="productos">
    <div class="producto">
      <div class="img">🧺</div>
      <h3>Producto</h3>
      <p>$00.00</p>
    </div>
    <div class="producto">
      <div class="img">🧺</div>
      <h3>Producto</h3>
      <p>$00.00</p>
    </div>
    <div class="producto">
      <div class="img">🧺</div>
      <h3>Producto</h3>
      <p>$00.00</p>
    </div>
    <div class="producto">
      <div class="img">🧺</div>
      <h3>Producto</h3>
      <p>$00.00</p>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>© 2025 El Baul de Maribel</p>
  </footer>

  <!-- ===== MENÚ LATERAL ===== -->
  <aside class="menu-lateral">
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Productos</a></li>
      <li><a href="#">Ofertas</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </aside>

  <!-- ===== OVERLAY ===== -->
  <div class="overlay"></div>

  <!-- ===== SCRIPT ===== -->
  <script src="./js/main.js"></script>

</body>
</html>
