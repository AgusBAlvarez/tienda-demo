<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Baul de Maribel</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav>
    <div class="logo">
      <img src="./assets/logo.png" alt="El Baul de Maribel">
    </div>

    <div class="buscador">
      <input type="text" placeholder="Buscar..." id="buscadorInput">
      <button aria-label="Buscar">🔍</button>
    </div>

    <button class="carrito" aria-label="Carrito" id="btnCarrito">🛒</button>
    <button class="menu-btn" aria-label="Menú">☰</button>
  </nav>

  <!-- ===== BANNER ===== -->
  <section class="banner">
    <div class="banner-img"></div>
  </section>

    <!-- ===== CATEGORÍAS ===== -->
    <section class="categorias" id="categorias">
      <!-- Se llena dinámicamente desde Firestore -->
    </section>

  <!-- ===== PRODUCTOS ===== -->
  <section class="productos" id="productos">
    <!-- Se llena dinámicamente desde Firestore -->
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>© 2025 El Baul de Maribel</p>
  </footer>

  <!-- ===== MENÚ LATERAL ===== -->
  <aside class="menu-lateral">
    <button class="cerrar" aria-label="Cerrar">✕</button>
    <ul>
      <li><a href="./index.html">Inicio</a></li>
      <li><a href="#productos">Productos</a></li>
      <li><a href="#categorias">Categorías</a></li>
      <li><a href="https://wa.me/5492616946182" target="_blank">Contacto</a></li>
    </ul>
  </aside>

  <!-- ===== OVERLAY ===== -->
  <div class="overlay"></div>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== MODAL DETALLE PRODUCTO ===== -->
  <div class="modal-overlay" id="modalOverlay"></div>

  <div class="modal-producto" id="modalProducto">
    <button class="modal-volver" id="modalVolver" aria-label="Volver">←</button>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <h2 id="modalNombre">Nombre</h2>
      <p class="modal-descripcion" id="modalDescripcion"></p>
      <p class="modal-precio" id="modalPrecio"></p>
      <div class="modal-cantidad">
        <button class="cant-btn" id="cantMenos">−</button>
        <span id="cantValor">1</span>
        <button class="cant-btn" id="cantMas">+</button>
      </div>
      <button class="btn-agregar-modal" id="btnAgregarModal">Agregar al carrito</button>
    </div>
  </div>

    <!-- ===== MODAL CONFIRMACIÓN ===== -->
  <div class="modal-confirm-overlay" id="confirmOverlay"></div>

  <div class="modal-confirm" id="confirmModal">
    <div class="confirm-icono">✓</div>
    <p class="confirm-texto">Producto añadido al carrito exitosamente</p>
    <div class="confirm-botones">
      <button class="btn-ver-carrito" id="btnVerCarrito">Ver carrito</button>
      <button class="btn-seguir" id="btnSeguirComprando">Seguir comprando</button>
    </div>
  </div>

    <!-- ===== MODAL CARRITO ===== -->
  <div class="modal-carrito-overlay" id="carritoOverlay"></div>

    <div class="modal-carrito" id="modalCarrito">
    <!-- VISTA 1: CARRITO -->
    <div id="vistaCarrito">
      <div class="carrito-header">
        <h2>Tu pedido</h2>
        <button class="carrito-cerrar" id="carritoCerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="carrito-body" id="carritoBody"></div>
      <div class="carrito-footer" id="carritoFooter">
        <div class="carrito-total">
          <span>Total:</span>
          <strong id="carritoTotal">$0</strong>
        </div>
        <button class="btn-finalizar" id="btnFinalizar">Finalizar pedido</button>
      </div>
    </div>

    <!-- VISTA 2: PEDIDO FINALIZADO -->
    <div id="vistaFinalizado" style="display:none;">
      <div class="carrito-header">
        <h2>¡Pedido listo!</h2>
        <button class="carrito-cerrar" id="carritoCerrarFinal" aria-label="Cerrar">✕</button>
      </div>
      <div class="carrito-body">
        <div class="pedido-finalizado">
          <p>Tu código de pedido es:</p>
          <div class="codigo-grande" id="codigoPedido">#XXXX</div>
          <p class="pedido-instruccion">Enviá este mensaje por WhatsApp para coordinar el pago y la entrega.</p>
        </div>
      </div>
      <div class="carrito-footer">
        <button class="btn-whatsapp" id="btnWhatsApp">Enviar por WhatsApp</button>
      </div>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script type="module" src="./js/main.js"></script>

</body>
</html>
