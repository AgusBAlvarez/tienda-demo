<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banners — Tienda Demo</title>
  
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div class="logo">
      <img src="../assets/logo.png" alt="Tienda Demo">
      <span>Panel Admin</span>
    </div>
    <nav>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./productos.html">Productos</a>
      <a href="./categorias.html">Categorías</a>
      <a href="./banners.html" class="active">Banners / Ofertas</a>
      <a href="./ventas.html">Registrar venta</a>
      <a href="./historial.html">Historial</a>
    </nav>
  </aside>

  <header class="admin-header">
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
    <span class="user">Conectada como <strong id="userEmail"></strong></span>
    <button class="btn-logout" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <div class="header-con-accion">
      <h1>Banners y Ofertas</h1>
      <button class="btn-primary" id="btnAgregarBanner"><i class="bi bi-plus-lg"></i> Agregar Banner</button>
    </div>

    <table class="tabla-productos">
      <thead>
        <tr>
          <th>Imagen</th>
          <th>Texto / Título</th>
          <th>Link (opcional)</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaBanners">
        <tr><td colspan="4" style="text-align:center;">Cargando...</td></tr>
      </tbody>
    </table>

    <footer class="admin-footer">
        <p>
            Demo de portfolio · Desarrollado por <strong>Agustina Belén Alvarez</strong>
            · <a href="https://linkedin.com/in/agustinabelenalvarez" target="_blank">LinkedIn</a>
            · <a href="https://github.com/AgusBAlvarez/el-baul-de-maribel" target="_blank">GitHub</a>
        </p>
    </footer>
  </main>

  <!-- Panel Lateral para agregar banner -->
  <div class="panel-overlay" id="panelOverlay"></div>
  <aside class="panel-lateral" id="panelBanner">
    <div class="panel-header">
      <h2 id="panelTitulo">Agregar Banner</h2>
      <button class="panel-cerrar" id="panelCerrar"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="panel-body">
      <form id="formBanner">
        <div class="form-grupo">
          <label>Imagen del Banner</label>
          <div class="foto-uploader">
            <div class="foto-preview" id="fotoPreview"><span class="foto-placeholder">📦</span></div>
            <div class="foto-acciones">
                <button type="button" class="btn-secundario" id="btnSubirFoto">Subir foto</button>
            </div>
          </div>
          <input type="hidden" id="fotoUrl" value="">
        </div>
        <div class="form-grupo">
          <label for="titulo">Texto / Título (opcional)</label>
          <input type="text" id="titulo" placeholder="Ej: 20% OFF en Cables">
        </div>
        <div class="form-grupo">
          <label for="categoriaBanner">Categoría a la que lleva (opcional)</label>
          <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
            <select id="categoriaBanner" style="flex: 1;">
              <option value="">Ninguna (no hace nada al hacer clic)</option>
              <!-- Se llena con JS -->
            </select>
            <button type="button" class="btn-secundario" id="btnNuevaCategoria" title="Crear categoría">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          <p id="infoCategoria" style="font-size: 0.75rem; color: #7a6a5f;"></p>
        </div>
        <p class="form-error" id="formError"></p>
      </form>
    </div>
    <div class="panel-footer">
      <button class="btn-secundario" id="btnCancelar">Cancelar</button>
      <button class="btn-primary" id="btnGuardar" form="formBanner" type="submit">Guardar</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script type="module" src="../js/banners.js"></script>
</body>
</html>
