<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorías — El Baul de Maribel</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div class="logo">
      <img src="../assets/logo.png" alt="El Baul de Maribel">
      <span>Panel Admin</span>
    </div>
    <nav>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./productos.html">Productos</a>
      <a href="./categorias.html" class="active">Categorías</a>
      <a href="./ventas.html">Registrar venta</a>
      <a href="./historial.html">Historial</a>
    </nav>
  </aside>

  <header class="admin-header">
    <span class="user">Conectada como <strong id="userEmail"></strong></span>
    <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <div class="header-con-accion">
      <h1>Categorías</h1>
      <button class="btn-primary">+ Agregar categoría</button>
    </div>

    <table class="tabla-productos">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Productos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaCategorias">
        <tr>
          <td colspan="3" style="text-align:center; padding:2rem; color:#7a6a5f;">
            Cargando categorías...
          </td>
        </tr>
      </tbody>
    </table>
  </main>

  <!-- ===== PANEL LATERAL (formulario categoría) ===== -->
  <div class="panel-overlay" id="panelOverlay"></div>

  <aside class="panel-lateral" id="panelCategoria">
    <div class="panel-header">
      <h2 id="panelTitulo">Agregar categoría</h2>
      <button class="panel-cerrar" id="panelCerrar" aria-label="Cerrar">✕</button>
    </div>

    <div class="panel-body">
      <form id="formCategoria">
        <div class="form-grupo">
          <label for="nombreCategoria">Nombre *</label>
          <input type="text" id="nombreCategoria" required maxlength="40">
        </div>
        <p class="form-error" id="formError"></p>
      </form>
    </div>

    <div class="panel-footer">
      <button class="btn-secundario" id="btnCancelar">Cancelar</button>
      <button class="btn-primary" id="btnGuardar" form="formCategoria" type="submit">Guardar</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script type="module" src="../js/categorias.js"></script>
</body>
</html>
