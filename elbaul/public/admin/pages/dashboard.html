<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Tienda Demo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div class="logo">
      <img src="../assets/logo.png" alt="Tienda Demo">
      <span>Panel Admin</span>
    </div>
    <nav>
      <a href="./dashboard.html" class="active">Dashboard</a>
      <a href="./productos.html">Productos</a>
      <a href="./categorias.html">Categorías</a>
      <a href="./ventas.html">Registrar venta</a>
      <a href="./historial.html">Historial</a>
    </nav>
  </aside>

  <header class="admin-header">
    <span class="user">Conectada como <strong id="userEmail"></strong></span>
    <button class="btn-logout" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <h1>Dashboard</h1>

    <section class="dashboard-metrica">
      <h2>⚠️ Stock bajo</h2>
      <div id="listaStockBajo">
        <p class="texto-vacio">Cargando...</p>
      </div>
    </section>

    <section class="dashboard-metrica">
      <h2>Últimas ventas</h2>
      <div id="listaUltimasVentas">
        <p class="texto-vacio">Próximamente</p>
      </div>
    </section>

    <section class="dashboard-metrica">
      <h2>Pedidos pendientes</h2>
      <div id="listaPedidosPendientes">
        <p class="texto-vacio">Próximamente</p>
      </div>
    </section>

    <section class="dashboard-metrica">
      <h2>Ventas del día</h2>
      <div id="resumenVentasDia">
        <p class="texto-vacio">Próximamente</p>
      </div>
    </section>
  </main>

  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
