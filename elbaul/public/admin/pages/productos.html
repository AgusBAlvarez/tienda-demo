<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos — El Baul de Maribel</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../styles/admin.css">
</head>
<body class="admin-page">

  <!-- ===== SIDEBAR ===== -->
  <aside class="admin-sidebar">
    <div class="logo">
      <img src="../assets/logo.png" alt="El Baul de Maribel">
      <span>Panel Admin</span>
    </div>
    <nav>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./productos.html" class="active">Productos</a>
      <a href="./categorias.html">Categorías</a>
      <a href="./ventas.html">Registrar venta</a>
      <a href="./historial.html">Historial</a>
    </nav>
  </aside>

  <!-- ===== HEADER ===== -->
  <header class="admin-header">
    <span class="user">Conectada como <strong id="userEmail"></strong></span>
    <button class="btn-logout" id="logoutBtn">Cerrar sesión</button>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="admin-main">
    <div class="header-con-accion">
      <h1>Productos</h1>
      <button class="btn-primary">+ Agregar producto</button>
    </div>

    <table class="tabla-productos">
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaBody">
        <tr>
          <td colspan="7" style="text-align:center; padding:2rem; color:#7a6a5f;">
            Cargando productos...
          </td>
        </tr>
      </tbody>
    </table>
  </main>

    <!-- ===== PANEL LATERAL (formulario producto) ===== -->
  <div class="panel-overlay" id="panelOverlay"></div>

  <aside class="panel-lateral" id="panelProducto">
    <div class="panel-header">
      <h2 id="panelTitulo">Agregar producto</h2>
      <button class="panel-cerrar" id="panelCerrar" aria-label="Cerrar">✕</button>
    </div>

    <div class="panel-body">
      <form id="formProducto">
        <div class="form-grupo">
          <label>Foto</label>
          <div class="foto-uploader" id="fotoUploader">
            <div class="foto-preview" id="fotoPreview">
              <span class="foto-placeholder">📦</span>
            </div>
            <div class="foto-acciones">
              <button type="button" class="btn-secundario" id="btnSubirFoto">Subir foto</button>
              <button type="button" class="btn-secundario" id="btnQuitarFoto" style="display:none;">Quitar</button>
            </div>
          </div>
          <input type="hidden" id="fotoUrl" value="">
        </div>
        <div class="form-grupo">
          <label for="nombre">Nombre *</label>
          <input type="text" id="nombre" required>
        </div>

        <div class="form-grupo">
          <label for="categoria">Categoría *</label>
          <select id="categoria" required>
            <option value="">Cargando...</option>
          </select>
        </div>

        <div class="form-fila">
          <div class="form-grupo">
            <label for="precio">Precio *</label>
            <input type="number" id="precio" min="0" required>
          </div>
          <div class="form-grupo">
            <label for="stock">Stock *</label>
            <input type="number" id="stock" min="0" required>
          </div>
        </div>

        <div class="form-grupo">
          <label for="stockMinimo">Stock mínimo</label>
          <input type="number" id="stockMinimo" min="0" value="3">
        </div>

        <p class="form-error" id="formError"></p>
      </form>
    </div>

    <div class="panel-footer">
      <button class="btn-secundario" id="btnCancelar">Cancelar</button>
      <button class="btn-primary" id="btnGuardar" form="formProducto" type="submit">Guardar</button>
    </div>
  </aside>


    <div class="toast" id="toast"></div>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script type="module" src="../js/productos.js"></script>
</body>
</html>
